name: Promote QA Main to Final Repo

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout QA repo MAIN branch (IMPORTANT CHANGE)
      - name: Checkout QA repo main
        uses: actions/checkout@v3
        with:
          repository: PranavPuranik-hub/QA-Software-Product   # ✅ your QA repo
          token: ${{ secrets.QA_REPO_TOKEN }}
          ref: main
          path: qa-repo

      # 2. Checkout final repo
      - name: Checkout final repo
        uses: actions/checkout@v3
        with:
          repository: PranavPuranik-hub/final-Software-Product
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-repo

      # 3. Setup Git
      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 4. Copy ONLY tested code from QA main
      - name: Copy folder
        run: |
          mkdir -p final-repo/folderF1
          cp -r qa-repo/folderF1/. final-repo/folderF1/

      # 5. Force change
      - name: Force change
        run: |
          echo "QA main sync ${{ github.run_id }}" >> final-repo/folderF1/auto-log.txt

      # 6. Create PR in final repo (always to main)
      - name: Create PR in final repo
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-repo
          branch: qa-to-final-${{ github.run_id }}
          base: main
          commit-message: "QA main → Final"
          title: "PR: QA main to Final"
          body: "Only tested code from QA main"

      # 7. Send Email
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "QA → Final PR Created"
          body: |
            QA main has been promoted to Final repo.

            PR Branch: qa-to-final-${{ github.run_id }}

            👉 View PR:
            ${{ steps.create_pr.outputs.pull-request-url }}

          to: pranavm.24.beis@acharya.ac.in
          from: ${{ secrets.EMAIL_USERNAME }}