name: Promote to Final Repo

on:
  pull_request:
    types: [labeled]

jobs:
  promote:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Software-Product-QA
        uses: actions/checkout@v3

     
      - name: Checkout final-Software-Product
        uses: actions/checkout@v3
        with:
          repository: PranavPuranik-hub/final-Software-Product
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-Software-Product

     
      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      
      - name: Copy folder
        run: |
          mkdir -p final-Software-Product/folderF1
          cp -r folderF1/. final-Software-Product/folderF1/

      
      - name: Force change
        run: |
          echo "Run ${{ github.run_id }}" >> final-Software-Product/folderF1/auto-log.txt

      
      - name: Detect default branch
        id: detect
        run: |
          cd final-Software-Product
          DEFAULT=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

     
      - name: Create PR in final repo
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-Software-Product
          branch: auto-update-${{ github.run_id }}
          base: ${{ steps.detect.outputs.branch }}
          add-paths: |
            .
          commit-message: "Auto update from QA repo"
          title: "Auto PR from QA repo"
          body: "Created automatically after approval"