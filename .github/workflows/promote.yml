name: Promote to Final Repo v2

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to promote"
        required: true
        default: "test-branch"

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the selected branch (IMPORTANT CHANGE)
      - name: Checkout source branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.source_branch }}

      # 2. Checkout final repo
      - name: Checkout final-Software-Product
        uses: actions/checkout@v3
        with:
          repository: PranavPuranik-hub/final-Software-Product
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-Software-Product

      # 3. Setup Git
      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 4. Copy folder
      - name: Copy folder
        run: |
          mkdir -p final-Software-Product/folderF1
          cp -r folderF1/. final-Software-Product/folderF1/

      # 5. Force change
      - name: Force change
        run: |
          echo "Run ${{ github.run_id }}" >> final-Software-Product/folderF1/auto-log.txt

      # 6. Detect default branch
      - name: Detect default branch
        id: detect
        run: |
          cd final-Software-Product
          DEFAULT=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

      # 7. Create PR
      - name: Create PR in final repo
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.FINAL_REPO_TOKEN }}
          path: final-Software-Product
          branch: auto-update-${{ github.run_id }}
          base: ${{ steps.detect.outputs.branch }}
          add-paths: |
            .
          commit-message: "Auto update from ${{ github.event.inputs.source_branch }}"
          title: "Auto PR from ${{ github.event.inputs.source_branch }}"
          body: "Created manually via button"